<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Grand Theft Auto: Vice City - Web 3D 纯网页重写版 (v0.5)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0614;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }
        /* VC 经典霓虹 HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .hud-top-right {
            position: absolute;
            top: 24px;
            right: 28px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .vc-money {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 38px;
            color: #55c842;
            text-shadow: 2px 2px 0 #1b4b12, 0 0 10px rgba(85,200,66,0.5);
            letter-spacing: 2px;
        }
        .hud-stats-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .stat-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(18, 5, 29, 0.65);
            border: 1px solid rgba(255, 65, 147, 0.4);
            padding: 6px 14px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stat-icon {
            font-size: 20px;
        }
        .stat-val {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 26px;
            letter-spacing: 1px;
        }
        .stat-health .stat-val {
            color: #ea3556;
            text-shadow: 1px 1px 0 #570817;
        }
        .stat-armor .stat-val {
            color: #d8c232;
            text-shadow: 1px 1px 0 #4f470e;
        }
        .stat-weapon {
            color: #2edbf0;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(46,219,240,0.6);
        }
        /* 经典雷达 MiniMap */
        #radar-container {
            position: absolute;
            bottom: 24px;
            left: 24px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(13, 6, 20, 0.85);
            border: 3px solid #ff4193;
            box-shadow: 0 0 15px rgba(255,65,147,0.6), inset 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        #radar-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 车辆提示 / 交互面板 */
        #vehicle-prompt {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 65, 147, 0.85);
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255,65,147,0.8);
            display: none;
            pointer-events: none;
            letter-spacing: 1px;
        }
        /* 启动/引导界面 */
        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2e1045 0%, #0d0614 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        .vc-logo {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 78px;
            color: #ff4193;
            text-shadow: 0 0 20px #ff4193, 3px 3px 0 #ffe600, 0 0 40px rgba(255,65,147,0.8);
            margin-bottom: 8px;
            line-height: 1;
            font-style: italic;
        }
        .vc-subtitle {
            font-size: 22px;
            letter-spacing: 6px;
            color: #2edbf0;
            text-shadow: 0 0 10px #2edbf0;
            margin-bottom: 30px;
            font-weight: 800;
        }
        .start-btn {
            background: linear-gradient(135deg, #ff4193 0%, #a212df 100%);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            padding: 14px 40px;
            border-radius: 30px;
            border: 2px solid #ffe600;
            box-shadow: 0 0 25px rgba(255,65,147,0.7);
            transition: all 0.2s ease;
            letter-spacing: 2px;
        }
        .start-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 35px rgba(255,65,147,1);
        }
        .instructions-card {
            margin-top: 36px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(46,219,240,0.4);
            border-radius: 12px;
            padding: 16px 28px;
            font-size: 14px;
            line-height: 1.8;
            color: #d1d5db;
            max-width: 520px;
        }
        .instructions-card span {
            color: #ffe600;
            font-weight: bold;
        }
        /* 十字准星 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 65, 147, 0.85);
            border: 2px solid #fff;
            box-shadow: 0 0 6px #ff4193;
            pointer-events: none;
            display: none;
        }
    </style>
    <!-- Three.js 独立现代化纯网页 3D 渲染引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div id="hud">
        <div class="hud-top-right">
            <div class="vc-money">$00350000</div>
            <div class="hud-stats-row">
                <div class="stat-box stat-health">
                    <span class="stat-icon">❤️</span>

                    <span class="stat-weapon" id="val-weapon">UZI-9MM 30/150</span>

        <!-- 罪恶都市通缉星级 Wanted Stars -->
        <div id="wanted-stars" style="position: absolute; top: 120px; right: 28px; display: flex; gap: 6px; font-size: 26px;">
            <span class="star" style="color: #444; text-shadow: 0 0 4px #000;">★</span>
            <span class="star" style="color: #444; text-shadow: 0 0 4px #000;">★</span>
            <span class="star" style="color: #444; text-shadow: 0 0 4px #000;">★</span>
            <span class="star" style="color: #444; text-shadow: 0 0 4px #000;">★</span>
            <span class="star" style="color: #444; text-shadow: 0 0 4px #000;">★</span>
            <span class="star" style="color: #444; text-shadow: 0 0 4px #000;">★</span>
        </div>
        <!-- 跑车速度表 Speedometer -->
        <div id="speedo-box" style="position: absolute; bottom: 30px; right: 30px; background: rgba(18,5,29,0.7); border: 2px solid #2edbf0; padding: 10px 18px; border-radius: 8px; display: none; text-align: center; box-shadow: 0 0 15px rgba(46,219,240,0.5);">
            <div style="font-size: 11px; letter-spacing: 2px; color: #2edbf0;">SPEED (MPH)</div>
            <div id="speedo-val" style="font-family: Impact, sans-serif; font-size: 34px; color: #ffe600;">0</div>
        </div>
        <div id="radar-container">
            <canvas id="radar-canvas" width="140" height="140"></canvas>
        </div>

        <div id="vehicle-prompt">按 [F] 或 [Enter] 驾驶豪华跑车 Infernus</div>
        <div id="crosshair"></div>
    </div>

    <div id="overlay-screen">
        <div class="vc-logo">Vice City</div>
        <div class="vc-subtitle">HTML5 3D WEB HD EDITION</div>
        <button class="start-btn" id="start-btn">点击进入罪恶都市 (START GAME)</button>
        <div class="instructions-card">
            <p>🕹️ <span>操作指南</span>：</p>
            <p>【步行模式】 <span>W A S D</span> 移动 | <span>鼠标滑动</span> 旋转视角 | <span>空格</span> 跳跃 | <span>左键</span> 射击</p>
            <p>【载具模式】 靠近跑车按 <span>F</span> 上车 / 下车 | <span>W / S</span> 油门与刹车 | <span>A / D</span> 转向</p>
        </div>
    </div>

    <script>
        // --- 核心 WebGL 3D 场景与引擎逻辑 (v0.2 重构版本) ---
        
        // --- 80s 经典合成音效引擎 (Web Audio API 纯原生无外部依赖) ---
        class VCAudioEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playGunshot() {
                if (!this.ctx) return;
                const bufferSize = Math.floor(this.ctx.sampleRate * 0.12);
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.02));
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1400, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.12);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.7, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
            playEngineRev(speedRatio) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                const baseFreq = 40 + Math.abs(speedRatio) * 90;
                osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            
            
            playCashPickup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(1200, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.2);
            }

            playSiren() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(650, now);
                osc.frequency.linearRampToValueAtTime(950, now + 0.25);
                osc.frequency.linearRampToValueAtTime(650, now + 0.5);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.5);
            }

            playDoorSlam() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
        }
        const sfx = new VCAudioEngine();
        let wantedLevel = 0;
        let ammoCount = 150;
        const bullets = [];
        let walkCycle = 0;
        const canvas = document.getElementById('webgl-canvas');
        const overlay = document.getElementById('overlay-screen');
        const startBtn = document.getElementById('start-btn');
        const healthEl = document.getElementById('val-health');
        const armorEl = document.getElementById('val-armor');
        const vehiclePrompt = document.getElementById('vehicle-prompt');
        const crosshair = document.getElementById('crosshair');

        let scene, camera, renderer;
        let player, car;
        let inVehicle = false;
                sfx.playDoorSlam();
                document.getElementById("speedo-box").style.display = "none";
        let keys = {};
        let cameraAngle = { yaw: 0, pitch: 0.2 };
        let isPointerLocked = false;

        // 城市建筑与装饰列表
        const cityBuildings = [];
        const palmTrees = [];

        function initScene() {
            scene = new THREE.Scene();
            // 罪恶都市经典迈阿密粉紫黄昏渐变天空雾效
            scene.background = new THREE.Color(0x281236);
            scene.fog = new THREE.FogExp2(0x281236, 0.007);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // 光照设计：迈阿密夕阳阳光 + 霓虹环境光
            const ambientLight = new THREE.AmbientLight(0xffb7c5, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffa040, 1.4);
            sunLight.position.set(100, 120, 80);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 400;
            const d = 100;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // 地面与 Ocean Beach 宽阔沿海公路
            createEnvironment();

            // 生成经典主角 Tommy Vercetti
            createPlayer();

            // 生成沿街漫步的迈阿密市民 NPC
            const pedColors = [0xe84118, 0x9c88ff, 0xfbc531, 0x4cd137, 0x487eb0, 0xe056fd];
            for (let i = -180; i <= 180; i += 30) {
                createPedestrian(18 + Math.random() * 8, i, pedColors[Math.floor(Math.random() * pedColors.length)]);
                createPedestrian(-18 - Math.random() * 8, i, pedColors[Math.floor(Math.random() * pedColors.length)]);
            }


            // 生成经典超级跑车 Infernus (兰博基尼风格)
            createVehicle();
            createPoliceCar(-8, -40);
            createPoliceCar(-8, 80);

            // 监听窗口与输入
            window.addEventListener('resize', onWindowResize);
            setupInput();
        }

        function createEnvironment() {
            // 宽广主路与人行道
            const roadGeo = new THREE.PlaneGeometry(60, 600);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1f232a, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            scene.add(road);

            // 道路双黄线
            const lineGeo = new THREE.PlaneGeometry(0.8, 600);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffd23f });
            const roadLine = new THREE.Mesh(lineGeo, lineMat);
            roadLine.rotation.x = -Math.PI / 2;
            roadLine.position.y = 0.02;
            scene.add(roadLine);

            // 海滩与海水
            const sandGeo = new THREE.PlaneGeometry(200, 600);
            const sandMat = new THREE.MeshStandardMaterial({ color: 0xeedcb2, roughness: 0.9 });
            const sand = new THREE.Mesh(sandGeo, sandMat);
            sand.rotation.x = -Math.PI / 2;
            sand.position.set(130, -0.05, 0);
            sand.receiveShadow = true;
            scene.add(sand);

            const oceanGeo = new THREE.PlaneGeometry(400, 600);
            const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1177aa, roughness: 0.1, metalness: 0.8 });
            const ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.set(430, -0.2, 0);
            scene.add(ocean);

            // 生成沿街 80 年代迈阿密装饰艺术风格 (Art Deco) 霓虹建筑
            const buildingColors = [0xfc5c65, 0xf7b731, 0x45aaf2, 0x26de81, 0xa55eea, 0xfd9644];
            for (let z = -250; z <= 250; z += 40) {
                const height = 25 + Math.random() * 45;
                const width = 28;
                const depth = 28;
                const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];

                const bGeo = new THREE.BoxGeometry(width, height, depth);
                const bMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 });
                const building = new THREE.Mesh(bGeo, bMat);
                building.position.set(-50, height / 2, z);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
                cityBuildings.push(building);

                // 建筑霓虹招牌装饰灯条
                const neonGeo = new THREE.BoxGeometry(width + 0.4, 1.2, depth + 0.4);
                const neonMat = new THREE.MeshBasicMaterial({ color: 0xff007f });
                const neonStrip = new THREE.Mesh(neonGeo, neonMat);
                neonStrip.position.set(-50, height * 0.7, z);
                scene.add(neonStrip);

                // 沿街椰子树 (Vice City 标志性 Palm Tree)
                createPalmTree(32, z);
                createPalmTree(-32, z);
            }
        }

        function createPalmTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.5, 0.9, 14, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6e4a2e, roughness: 0.9 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 7, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leavesGroup = new THREE.Group();
            leavesGroup.position.set(x, 14, z);
            const leafGeo = new THREE.ConeGeometry(4, 2, 6);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x208034, roughness: 0.7 });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leavesGroup.add(leaf);
            scene.add(leavesGroup);
            palmTrees.push({ trunk, leavesGroup });
        }

        
        const pedestrians = [];
        const droppedCash = [];
        let playerMoney = 350000;

        function createPedestrian(x, z, shirtColor) {
            const ped = new THREE.Group();

            // 躯干
            const torsoGeo = new THREE.BoxGeometry(0.9, 1.1, 0.5);
            const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.y = 1.5;
            torso.castShadow = true;
            ped.add(torso);

            // 头部
            const headGeo = new THREE.BoxGeometry(0.45, 0.55, 0.45);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xf5cd79 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.35;
            ped.add(head);

            // 双腿
            const legGeo = new THREE.BoxGeometry(0.35, 0.95, 0.4);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x303952 });
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.2, 0.47, 0);
            ped.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.2, 0.47, 0);
            ped.add(rightLeg);

            ped.position.set(x, 0, z);
            ped.userData = {
                health: 40,
                speed: 0.04 + Math.random() * 0.03,
                walkTimer: Math.random() * 10,
                isDead: false,
                leftLeg, rightLeg
            };
            scene.add(ped);
            pedestrians.push(ped);
        }

        function createPlayer() {
            // Tommy Vercetti 经典模型 (夏威夷蓝绿衬衫、牛仔裤)
            player = new THREE.Group();

            // 躯干 (夏威夷夏日短袖)
            const torsoGeo = new THREE.BoxGeometry(1.0, 1.2, 0.6);
            const torsoMat = new THREE.MeshStandardMaterial({ color: 0x1dd1a1 });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.y = 1.6;
            torso.castShadow = true;
            player.add(torso);

            // 头部
            const headGeo = new THREE.BoxGeometry(0.5, 0.6, 0.5);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.5;
            head.castShadow = true;
            player.add(head);

            // 经典黑发
            const hairGeo = new THREE.BoxGeometry(0.54, 0.25, 0.54);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x2c2c2c });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 2.8;
            player.add(hair);

            // 蓝色牛仔裤双腿
            const legGeo = new THREE.BoxGeometry(0.4, 1.0, 0.45);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x2e86de });
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.25, 0.5, 0);
            leftLeg.castShadow = true;
            player.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.25, 0.5, 0);
            rightLeg.castShadow = true;
            player.add(rightLeg);

            player.position.set(0, 0, 15);
            scene.add(player);
        }

        
        const policeCars = [];
        function createPoliceCar(x, z) {
            const pCar = new THREE.Group();
            
            // 警车底盘 (经典黑白配色)
            const bodyGeo = new THREE.BoxGeometry(2.4, 0.7, 5.0);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.65;
            body.castShadow = true;
            pCar.add(body);

            // 白色车门涂装
            const doorGeo = new THREE.BoxGeometry(2.44, 0.5, 1.8);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, 0.65, 0);
            pCar.add(door);

            // 警车车顶红蓝警灯
            const lightBar = new THREE.Group();
            lightBar.position.set(0, 1.35, -0.2);
            const redLightGeo = new THREE.BoxGeometry(0.8, 0.2, 0.3);
            const redLightMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });
            const redLight = new THREE.Mesh(redLightGeo, redLightMat);
            redLight.position.x = -0.5;
            lightBar.add(redLight);

            const blueLightGeo = new THREE.BoxGeometry(0.8, 0.2, 0.3);
            const blueLightMat = new THREE.MeshBasicMaterial({ color: 0x0066ff });
            const blueLight = new THREE.Mesh(blueLightGeo, blueLightMat);
            blueLight.position.x = 0.5;
            lightBar.add(blueLight);
            pCar.add(lightBar);

            // 车轮
            const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            [[-1.25, 0.42, 1.6], [1.25, 0.42, 1.6], [-1.25, 0.42, -1.6], [1.25, 0.42, -1.6]].forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.rotation.z = Math.PI / 2;
                w.position.set(...pos);
                pCar.add(w);
            });

            pCar.position.set(x, 0, z);
            pCar.userData = { speed: 0, maxSpeed: 1.2, lightBar, flashTimer: 0 };
            scene.add(pCar);
            policeCars.push(pCar);
        }

        function createVehicle() {
            // 经典超跑 Infernus (车身流线型与尾翼)
            car = new THREE.Group();

            // 主车身底盘 (纯正 Vice City 亮白/霓虹粉)
            const bodyGeo = new THREE.BoxGeometry(2.4, 0.65, 4.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            car.add(body);

            // 驾驶舱挡风玻璃
            const cabinGeo = new THREE.BoxGeometry(1.8, 0.55, 2.2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.15, -0.2);
            cabin.castShadow = true;
            car.add(cabin);

            // 标志性跑车高尾翼
            const spoilerGeo = new THREE.BoxGeometry(2.2, 0.1, 0.5);
            const spoilerMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const spoiler = new THREE.Mesh(spoilerGeo, spoilerMat);
            spoiler.position.set(0, 1.25, 2.2);
            car.add(spoiler);

            // 4个车轮
            const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.8 });
            const wheelOffsets = [
                [-1.25, 0.42, 1.5],
                [1.25, 0.42, 1.5],
                [-1.25, 0.42, -1.5],
                [1.25, 0.42, -1.5]
            ];
            wheelOffsets.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                wheel.castShadow = true;
                car.add(wheel);
            });

            // 车前大灯与霓虹尾灯
            const tailLightGeo = new THREE.BoxGeometry(1.8, 0.15, 0.1);
            const tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff1020 });
            const tailLight = new THREE.Mesh(tailLightGeo, tailLightMat);
            tailLight.position.set(0, 0.7, 2.41);
            car.add(tailLight);

            car.position.set(8, 0, 10);
            car.rotation.y = 0;
            car.userData = { speed: 0, maxSpeed: 1.8, accel: 0.02, friction: 0.98, steer: 0 };
            scene.add(car);
        }

        function setupInput() {

            window.addEventListener('mousedown', (e) => {
                if (e.button === 0 && isPointerLocked && !inVehicle) {
                    shootWeapon();
                }
            });

            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if (e.code === 'KeyF' || e.code === 'Enter') {
                    toggleVehicle();
                }
            });
            window.addEventListener('keyup', e => {
                keys[e.code] = false;
            });

            
            startBtn.addEventListener('click', () => {
                sfx.init();

                overlay.style.display = 'none';
                canvas.requestPointerLock();
                crosshair.style.display = 'block';
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === canvas);
            });

            window.addEventListener('mousemove', e => {
                if (!isPointerLocked) return;
                const sens = 0.0024;
                cameraAngle.yaw -= e.movementX * sens;
                cameraAngle.pitch -= e.movementY * sens;
                cameraAngle.pitch = Math.max(-0.2, Math.min(0.8, cameraAngle.pitch));
            });
        }

        
        
        function killPedestrian(ped) {
            ped.userData.isDead = true;
            ped.rotation.x = -Math.PI / 2;
            ped.position.y = 0.25;

            // 掉落经典绿色旋转钞票
            const cashGeo = new THREE.BoxGeometry(0.8, 0.1, 0.4);
            const cashMat = new THREE.MeshBasicMaterial({ color: 0x55c842 });
            const cashMesh = new THREE.Mesh(cashGeo, cashMat);
            cashMesh.position.set(ped.position.x, 0.5, ped.position.z);
            scene.add(cashMesh);
            droppedCash.push(cashMesh);

            setWantedLevel(wantedLevel + 1);
        }

        function shootWeapon() {
            if (ammoCount <= 0) return;
            ammoCount--;
            sfx.playGunshot();
            document.getElementById('val-weapon').innerText = 'UZI-9MM 30/' + ammoCount;

            // 枪口火焰与弹道
            const bulletGeo = new THREE.SphereGeometry(0.12, 6, 6);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffe600 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            const shootOrigin = player.position.clone().add(new THREE.Vector3(0, 1.6, 0));
            const shootDir = new THREE.Vector3(
                -Math.sin(cameraAngle.yaw) * Math.cos(cameraAngle.pitch),
                Math.sin(cameraAngle.pitch),
                -Math.cos(cameraAngle.yaw) * Math.cos(cameraAngle.pitch)
            ).normalize();

            bullet.position.copy(shootOrigin.addScaledVector(shootDir, 1.0));
            bullet.userData = { dir: shootDir, life: 60 };
            scene.add(bullet);
            bullets.push(bullet);

            // 击发增加警星几率
            if (Math.random() < 0.15 && wantedLevel < 6) {
                setWantedLevel(wantedLevel + 1);
            }
        }

        function setWantedLevel(stars) {
            wantedLevel = Math.min(6, Math.max(0, stars));
            const starEls = document.querySelectorAll('#wanted-stars .star');
            starEls.forEach((el, idx) => {
                if (idx < wantedLevel) {
                    el.style.color = '#ffe600';
                    el.style.textShadow = '0 0 10px #ffaa00';
                } else {
                    el.style.color = '#444';
                    el.style.textShadow = '0 0 4px #000';
                }
            });
        }

        function toggleVehicle() {
            const dist = player.position.distanceTo(car.position);
            if (!inVehicle && dist < 5.0) {
                inVehicle = true;
                sfx.playDoorSlam();
                document.getElementById("speedo-box").style.display = "block";
                player.visible = false;
                vehiclePrompt.style.display = 'none';
            } else if (inVehicle) {
                inVehicle = false;
                sfx.playDoorSlam();
                document.getElementById("speedo-box").style.display = "none";
                player.visible = true;
                player.position.set(car.position.x - 2.5, 0, car.position.z);
            }
        }

        function updateGame() {
            // 载具物理与驾驶逻辑
            const carData = car.userData;
            if (inVehicle) {
                if (keys['KeyW'] || keys['ArrowUp']) carData.speed = Math.min(carData.maxSpeed, carData.speed + carData.accel);
                if (keys['KeyS'] || keys['ArrowDown']) carData.speed = Math.max(-carData.maxSpeed * 0.4, carData.speed - carData.accel);
                if (keys['KeyA'] || keys['ArrowLeft']) car.rotation.y += 0.03 * (carData.speed >= 0 ? 1 : -1);
                if (keys['KeyD'] || keys['ArrowRight']) car.rotation.y -= 0.03 * (carData.speed >= 0 ? 1 : -1);

                carData.speed *= carData.friction;
                car.translateZ(-carData.speed);

                if (keys['KeyW'] || keys['ArrowUp'] || keys['KeyS'] || keys['ArrowDown']) {
                    if (Math.random() < 0.25) sfx.playEngineRev(carData.speed);
                }
                const speedMph = Math.round(Math.abs(carData.speed) * 85);
                document.getElementById('speedo-val').innerText = speedMph;


                // 相机跟随跑车第三人称电影视角
                const offset = new THREE.Vector3(0, 3.2, 7.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), car.rotation.y);
                camera.position.lerp(car.position.clone().add(offset), 0.12);
                camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 1.2, 0)));
            } else {
                // 步行移动与控制逻辑
                const moveSpeed = (keys['ShiftLeft'] ? 0.32 : 0.16);
                let moveDir = new THREE.Vector3(0, 0, 0);

                if (keys['KeyW']) moveDir.z -= 1;
                if (keys['KeyS']) moveDir.z += 1;
                if (keys['KeyA']) moveDir.x -= 1;
                if (keys['KeyD']) moveDir.x += 1;

                if (moveDir.lengthSq() > 0) {
                    moveDir.normalize();
                    moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngle.yaw);
                    player.position.addScaledVector(moveDir, moveSpeed);
                    player.rotation.y = Math.atan2(moveDir.x, moveDir.z);
                }

                // 检测靠近车辆
                const distToCar = player.position.distanceTo(car.position);
                vehiclePrompt.style.display = (distToCar < 5.0 ? 'block' : 'none');

                // 第三人称越肩视角
                const camDist = 4.8;
                camera.position.x = player.position.x + Math.sin(cameraAngle.yaw) * Math.cos(cameraAngle.pitch) * camDist;
                camera.position.y = player.position.y + Math.sin(cameraAngle.pitch) * camDist + 2.0;
                camera.position.z = player.position.z + Math.cos(cameraAngle.yaw) * Math.cos(cameraAngle.pitch) * camDist;
                camera.lookAt(player.position.x, player.position.y + 1.8, player.position.z);
            }

            
            // 更新飞行子弹与弹道轨迹
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.addScaledVector(b.userData.dir, 3.5);

                // 击中 NPC
                pedestrians.forEach(ped => {
                    if (!ped.userData.isDead && b.position.distanceTo(ped.position.clone().add(new THREE.Vector3(0, 1.2, 0))) < 1.4) {
                        b.userData.life = 0;
                        killPedestrian(ped);
                    }
                });

                b.userData.life--;
                if (b.userData.life <= 0) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            
            // 警车 AI 巡逻与追捕逻辑
            const targetPos = inVehicle ? car.position : player.position;
            policeCars.forEach(p => {
                p.userData.flashTimer += 0.1;
                // 警灯红蓝交替闪烁
                p.userData.lightBar.children[0].visible = Math.sin(p.userData.flashTimer * 10) > 0;
                p.userData.lightBar.children[1].visible = Math.sin(p.userData.flashTimer * 10) <= 0;

                if (wantedLevel > 0) {
                    // 朝玩家方向全速追击
                    p.lookAt(targetPos.x, p.position.y, targetPos.z);
                    const distToPlayer = p.position.distanceTo(targetPos);
                    if (distToPlayer > 4.0) {
                        p.translateZ(0.45 + wantedLevel * 0.1);
                        if (Math.random() < 0.05) sfx.playSiren();
                    } else {
                        // 撞击扣除护甲与生命
                        let curArmor = parseInt(armorEl.innerText);
                        let curHealth = parseInt(healthEl.innerText);
                        if (curArmor > 0) {
                            armorEl.innerText = Math.max(0, curArmor - 1);
                        } else if (curHealth > 0) {
                            healthEl.innerText = Math.max(0, curHealth - 1);
                        }
                    }
                }
            });

            
            // 行人 NPC 巡逻与摆腿动画
            pedestrians.forEach(ped => {
                if (ped.userData.isDead) return;
                ped.userData.walkTimer += 0.08;
                ped.userData.leftLeg.rotation.x = Math.sin(ped.userData.walkTimer) * 0.6;
                ped.userData.rightLeg.rotation.x = -Math.sin(ped.userData.walkTimer) * 0.6;
                ped.translateZ(-ped.userData.speed);

                // 巡逻折返
                if (ped.position.z > 240) ped.rotation.y = 0;
                else if (ped.position.z < -240) ped.rotation.y = Math.PI;

                // 车辆碰撞碾压
                if (inVehicle && car.userData.speed > 0.4 && ped.position.distanceTo(car.position) < 2.5) {
                    killPedestrian(ped);
                }
            });

            // 现金掉落拾取
            for (let i = droppedCash.length - 1; i >= 0; i--) {
                const cash = droppedCash[i];
                cash.rotation.y += 0.05;
                const dist = (inVehicle ? car.position : player.position).distanceTo(cash.position);
                if (dist < 3.0) {
                    playerMoney += 500;
                    document.querySelector('.vc-money').innerText = '$' + playerMoney.toString().padStart(8, '0');
                    sfx.playCashPickup();
                    scene.remove(cash);
                    droppedCash.splice(i, 1);
                }
            }

            // 更新小地图雷达
            drawRadar();
        }

        function drawRadar() {
            const rCanvas = document.getElementById('radar-canvas');
            const ctx = rCanvas.getContext('2d');
            const w = rCanvas.width;
            const h = rCanvas.height;
            const cx = w / 2;
            const cy = h / 2;

            ctx.clearRect(0, 0, w, h);

            // 背景网格与海域
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, w, h);

            ctx.save();
            ctx.translate(cx, cy);

            const activePos = inVehicle ? car.position : player.position;
            const angle = inVehicle ? -car.rotation.y : -cameraAngle.yaw;
            ctx.rotate(angle);

            // 绘制主公路
            ctx.fillStyle = '#334155';
            ctx.fillRect(-20, -100, 40, 200);

            // 绘制跑车坐标标记 (粉色方块)
            const carRelX = (car.position.x - activePos.x) * 1.5;
            const carRelZ = (car.position.z - activePos.z) * 1.5;
            
            // 绘制警车标记 (蓝色方块)
            policeCars.forEach(p => {
                const pRelX = (p.position.x - activePos.x) * 1.5;
                const pRelZ = (p.position.z - activePos.z) * 1.5;
                ctx.fillStyle = '#00f0ff';
                ctx.fillRect(pRelX - 3, pRelZ - 3, 6, 6);
            });

            ctx.fillStyle = '#ff4193';
            ctx.fillRect(carRelX - 4, carRelZ - 4, 8, 8);

            ctx.restore();

            // 中心主角指示箭头 (黄色三角形)
            ctx.fillStyle = '#ffe600';
            ctx.beginPath();
            ctx.moveTo(cx, cy - 8);
            ctx.lineTo(cx - 6, cy + 6);
            ctx.lineTo(cx + 6, cy + 6);
            ctx.closePath();
            ctx.fill();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            renderer.render(scene, camera);
        }

        initScene();
        animate();
    </script>
</body>
</html>
